# Git identity used by worker pods when the orchestrator asks cmd/runner
# to make commits on behalf of the agent. Shipped to the pod as env vars
# CODE_AGENT_GIT_USER_NAME / _EMAIL; the runner applies them via
# `git config --global` at startup. Override per-deployment by editing
# your config/local/runtime.yaml.
git:
  user_name: code-agent
  user_email: code-agent@example.com

runtimes:
  default:
    mode: ephemeral
    namespace: code-agent
    image: ghcr.io/your-org/code-agent-worker:latest
    idle_timeout: 2h
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
    ingress:
      enabled: true
      host_template: task-{{.TaskID}}.opencode.internal
      tls_secret: opencode-wildcard

  local:
    mode: local
    opencode_url: http://localhost:4096
    opencode_password:
      env: OPENCODE_SERVER_PASSWORD
    workdir: ./.workspaces

  persistent:
    mode: persistent
    namespace: code-agent
    image: ghcr.io/your-org/code-agent-worker:latest
    idle_timeout: 6h
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
    ingress:
      enabled: true
      host_template: task-{{.ExtID}}.opencode.internal
      tls_secret: opencode-wildcard

  shared:
    mode: shared
    namespace: code-agent
    image: ghcr.io/your-org/code-agent-worker:latest
    ingress:
      enabled: true
      host_template: "{{.BoardID}}.opencode.internal"
