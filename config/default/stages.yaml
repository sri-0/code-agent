stage_sets:
  default:
    - name: todo
      provider_status: To Do
      action: noop
      next: in_progress

    - name: in_progress
      provider_status: In Progress
      action: run_agent
      timeout: 45m
      success_next: test
      failure_next: blocked
      # Skill bundles to attach for this stage only (unioned with board skills).
      # skills:
      #   - ts-strict
      system_prompt: |
        You are implementing ticket {{.TicketID}}: {{.Title}}.

        Description:
        {{.Description}}

        Acceptance criteria:
        {{.AcceptanceCriteria}}

        The following repositories are checked out:
        {{range .Repos}}- {{.Name}} at {{.Path}} (branch {{.Branch}})
        {{end}}

        Make the minimal set of changes across the relevant repositories.
        When implementation is complete, commit your changes on the branch
        named in the brief and push with `git push -u origin <branch>`.
        Do NOT open the merge request; the orchestrator handles that.

    - name: test
      provider_status: Testing
      action: run_agent
      max_retries: 2
      success_next: ready_for_qa
      failure_next: in_progress
      system_prompt: |
        Run the full test suite across all modified repositories.
        Fix any failures you caused. When everything passes, write a short
        summary of what was changed and what was tested.

    - name: ready_for_qa
      provider_status: Ready for QA
      action: open_mr
      mr_template: |
        {{.Task.Title}}

        Ticket: {{.Task.ExternalID}}{{if .Task.URL}} ({{.Task.URL}}){{end}}
        Repo: {{.Repo.Name}} ({{.Repo.Branch}} -> {{.Repo.BaseBranch}})

        {{if .Task.Description}}{{.Task.Description}}{{end}}
      terminal: true

    - name: blocked
      provider_status: Blocked
      action: comment_error
      terminal: true
