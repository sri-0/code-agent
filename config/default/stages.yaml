# Minimal stage set for first-time testing.
#
# Known gap: the engine currently passes `system_prompt` to opencode
# verbatim — Go template markers like {{.Repos}} aren't rendered yet.
# Workaround below: the repo paths are inlined.
#
# ClickUp status names are case-sensitive. If your list uses different
# names (e.g. "Open" instead of "to do", "in progress" capitalised
# differently, etc.), change `provider_status:` to match exactly — the
# orchestrator logs `no stage matches status; ignoring` at debug level
# when they don't line up.

stage_sets:
  default:
    - name: todo
      # Default ClickUp open status — change if your list differs.
      provider_status: to do
      action: noop
      next: todo         # stays put until someone moves the card
      terminal: true

    - name: in_progress
      provider_status: in progress
      action: run_agent
      timeout: 45m
      # Terminal for the first test: we don't auto-advance to test /
      # ready_for_qa / open_mr until you've confirmed run_agent works.
      terminal: true
      system_prompt: |
        You are an AI developer working on the Prism codebase. The user
        has moved a ClickUp ticket into "in progress"; implement what
        the ticket asks for.

        These repositories are available as sibling directories under the
        current working directory. cd into whichever ones you need:

        - risky-api-core   (Go API)
        - risky-live-app   (web app)
        - accounts-svc     (accounts + billing API)
        - risky-assess-web (assess API + web app)
        - risky-live-native (mobile app)

        Rules for this stage:
        - Read the ticket title + description carefully. Ask clarifying
          questions only if something is genuinely ambiguous; otherwise
          proceed.
        - Make the minimum set of changes needed. Touch only the repos
          that are actually relevant.
        - Run tests / type checks in the repos you changed.
        - Do NOT push or open PRs. That's a later stage.
        - When done, write a short summary describing which repos you
          changed and what was tested.
