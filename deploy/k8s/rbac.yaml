---
apiVersion: v1
kind: Namespace
metadata:
  name: code-agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: code-agent
  namespace: code-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: code-agent
  namespace: code-agent
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - configmaps
      - secrets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: code-agent
  namespace: code-agent
subjects:
  - kind: ServiceAccount
    name: code-agent
    namespace: code-agent
roleRef:
  kind: Role
  name: code-agent
  apiGroup: rbac.authorization.k8s.io
